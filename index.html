<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>宝可梦对战捕捉</title>
  <link rel="stylesheet" href="css/game.css?v=nozoom1" />
  <script type="importmap">
  {
    "imports": {
      "/js/game.js": "/js/game.js?v=catchsfx1",
      "/js/audio.js": "/js/audio.js?v=catchsfx1",
      "/js/data.js": "/js/data.js?v=tile1",
      "/js/battle.js": "/js/battle.js?v=heal2",
      "/js/battle-fx.js": "/js/battle-fx.js?v=battlefx2",
      "/js/catch.js": "/js/catch.js?v=rift1",
      "/js/generated-content.js": "/js/generated-content.js?v=rift1",
      "/js/region-content.js": "/js/region-content.js?v=rift1"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <header class="top-bar">
      <h1>宝可梦对战捕捉</h1>
      <div class="status">
        <button id="btn-dex" type="button">图鉴</button>
        <button id="btn-shop" type="button">商店</button>
        <button id="btn-battle-anim" type="button" title="战斗动画：重度目前支持小火龙/炎兔儿打斗帧">动画 · 轻量</button>
        <span id="coin-display">金币 300</span>
        <span id="fruit-display">异次元果 0</span>
        <span id="twin-key-display">双子钥匙 0</span>
        <span id="charm-display" class="hidden">闪耀护符</span>
      </div>
    </header>

    <!-- Screen: map select -->
    <section id="screen-select" class="screen">
      <div class="panel split-pane">
        <h2>选择地图</h2>
        <div class="pane-scroll">
          <div id="map-cards" class="map-cards"></div>
          <p id="map-note" class="hint"></p>
          <div class="row-actions">
            <button id="btn-refresh-all" type="button">刷新所有遭遇</button>
            <button id="btn-reset" type="button" class="danger">重新开始</button>
          </div>
        </div>
      </div>
      <div class="panel split-pane party-pane" id="party-pane">
        <h2 class="party-head">我的宝可梦 <span id="party-count">1/99</span></h2>
        <p class="hint party-hint">点卡排序。前 6 出场；收回进背包，上场回前 6。</p>
        <div id="party-list" class="party-list"></div>
      </div>
    </section>

    <!-- Screen: map view -->
    <section id="screen-map" class="screen hidden">
      <div class="panel">
        <button id="btn-back-select" type="button">← 返回选图</button>
        <h2 id="map-title">地图</h2>
        <div id="map-stage" class="map-stage">
          <img id="map-bg" alt="地图" />
          <div id="map-markers"></div>
        </div>
        <p class="hint">点击训练家或野生宝可梦开始对战。野生战胜后可捕捉；训练家要打完全队，再选一只捕捉。</p>
      </div>
    </section>

    <!-- Screen: pick fighter -->
    <section id="screen-pick" class="screen hidden">
      <div class="panel">
        <h2 id="pick-title">选择出战宝可梦</h2>
        <p id="pick-foe-info"></p>
        <div id="pick-party" class="party-list"></div>
        <button id="btn-cancel-pick" type="button">取消</button>
      </div>
    </section>

    <!-- Screen: battle -->
    <section id="screen-battle" class="screen hidden">
      <div class="panel battle-panel">
        <div id="battle-field" class="battle-field">
          <div class="fighter foe" data-slot="0">
            <div class="name-row">
              <span id="foe-name"></span>
              <span id="foe-tags"></span>
            </div>
            <div id="foe-skills" class="foe-skills"></div>
            <div class="hp-bar"><div id="foe-hp" class="hp-fill"></div></div>
            <div id="foe-sprite-wrap" class="sprite-wrap"></div>
          </div>
          <div class="fighter foe dual-only hidden" data-slot="1">
            <div class="name-row">
              <span id="foe-name-1"></span>
              <span id="foe-tags-1"></span>
            </div>
            <div id="foe-skills-1" class="foe-skills"></div>
            <div class="hp-bar"><div id="foe-hp-1" class="hp-fill"></div></div>
            <div id="foe-sprite-wrap-1" class="sprite-wrap"></div>
          </div>
          <div id="ally-row" class="ally-row hidden"></div>
          <div class="fighter player" data-slot="0">
            <div id="player-sprite-wrap" class="sprite-wrap"></div>
            <div class="name-row">
              <span id="player-name"></span>
            </div>
            <div class="hp-bar"><div id="player-hp" class="hp-fill"></div></div>
          </div>
          <div class="fighter player dual-only hidden" data-slot="1">
            <div id="player-sprite-wrap-1" class="sprite-wrap"></div>
            <div class="name-row">
              <span id="player-name-1"></span>
            </div>
            <div class="hp-bar"><div id="player-hp-1" class="hp-fill"></div></div>
          </div>
        </div>
        <div id="battle-log" class="battle-log"></div>
        <div class="row-actions">
          <button id="btn-attack" type="button" class="primary">攻击</button>
          <button id="btn-item" type="button">道具</button>
          <button id="btn-flee-battle" type="button">逃跑</button>
        </div>
        <div id="item-panel" class="item-panel hidden">
          <div class="item-panel-head">
            <span>选择道具</span>
            <button id="btn-close-items" type="button">取消</button>
          </div>
          <div id="item-list" class="item-list"></div>
        </div>
      </div>
    </section>

    <!-- Screen: catch -->
    <section id="screen-catch" class="screen hidden">
      <div class="panel">
        <div class="catch-head">
          <h2>捕捉！</h2>
          <span id="catch-outlook" class="catch-outlook"></span>
        </div>
        <div id="catch-style" class="style-toggle" role="group" aria-label="捕捉方式">
          <button type="button" data-style="flick">甩出</button>
          <button type="button" data-style="sling">拉弓</button>
        </div>
        <p id="catch-info" class="hint">按住底部的球，朝宝可梦甩出。</p>
        <div id="ball-picker" class="ball-picker"></div>
        <canvas id="catch-canvas" width="640" height="360"></canvas>
        <div id="catch-result" class="catch-result"></div>
        <button id="btn-skip-catch" type="button">放弃捕捉</button>
      </div>
    </section>
  </div>
  <div id="dex-modal" class="shop-modal hidden" role="dialog" aria-modal="true" aria-labelledby="dex-title">
    <div class="shop-dialog panel dex-dialog">
      <h2 id="dex-title">图鉴</h2>
      <div id="dex-filters" class="dex-filters" role="group" aria-label="属性筛选"></div>
      <div id="dex-list" class="dex-list"></div>
      <button id="btn-close-dex" type="button">关闭</button>
    </div>
  </div>
  <div id="dex-detail-modal" class="shop-modal dex-detail-modal hidden" role="dialog" aria-modal="true" aria-labelledby="dex-detail-title">
    <div class="shop-dialog panel dex-detail-dialog">
      <h2 id="dex-detail-title">详情</h2>
      <div id="dex-detail" class="dex-detail"></div>
      <button id="btn-close-dex-detail" type="button">关闭</button>
    </div>
  </div>
  <div id="shop-modal" class="shop-modal hidden">
    <div class="shop-dialog panel">
      <h2>商店</h2>
      <div id="shop" class="shop"></div>
      <button id="btn-close-shop" type="button">关闭</button>
    </div>
  </div>
  <div id="reset-modal" class="shop-modal hidden" role="dialog" aria-modal="true" aria-labelledby="reset-title">
    <div class="shop-dialog panel reset-dialog">
      <h2 id="reset-title">重新开始</h2>
      <p>进度会清空，包括宝可梦、金币和道具。确定要重新开始吗？</p>
      <div class="row-actions">
        <button id="btn-reset-cancel" type="button">取消</button>
        <button id="btn-reset-confirm" type="button" class="danger">确定重新开始</button>
      </div>
    </div>
  </div>

</html>
